name: CI

on:
  pull_request:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  check:
    # Pushes build on the self-hosted Windows runner; pull requests (possibly from forks) stay on a
    # GitHub-hosted runner so outside code never runs on the self-hosted machine.
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || fromJSON('["self-hosted","windows","msi"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
